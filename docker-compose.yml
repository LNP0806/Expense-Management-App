services:
  # Cơ sở dữ liệu nội bộ
  db:
    image: postgres:16-alpine
    container_name: project-db
    restart: always
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lưu ý: Không mở ports ra ngoài host ở Production để bảo mật tối đa

  # Ứng dụng Backend
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      target: prod
    container_name: project-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: devops_user
      DB_PASSWORD: secretpassword
      DB_NAME: app_db
      JWT_SECRET: ${JWT_SECRET:-devsecretkey1234567890}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-devsecretrefresh1234567890}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - db
    command: >
      sh -c "npm run migrate && node src/server.js"

  # Ứng dụng Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: prod
    container_name: project-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
