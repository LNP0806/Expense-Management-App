name: Continuous Integration (CI)

# Kích hoạt pipeline khi có commit push vào main hoặc khi mở Pull Request vào main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM TRA CHẤT LƯỢNG MÃ NGUỒN (TESTING & LINTING)
  # ==========================================

  # 1.1 Kiểm tra Frontend (Linting)
  test-frontend:
    name: 🧪 Test & Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 1.2 Kiểm tra Backend (Unit & Integration Tests)
  test-backend:
    name: 🧪 Test Backend APIs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: be/package-lock.json

      - name: Install Backend dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret

  # ==========================================
  # GIAI ĐOẠN 2: BUILD, KIỂM TRA & PUSH LÊN DOCKER HUB
  # (CHỈ CHẠY KHI TOÀN BỘ TEST PHÍA TRÊN ĐÃ PASS)
  # ==========================================
  build-and-push:
    name: 🚀 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend] # <-- Ràng buộc: Tất cả test phải Pass 100% trước

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2.1 Build thử Frontend (React/Vite)
      - name: Setup Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Frontend dependencies
        run: cd fe && npm ci

      - name: Build Frontend Artifacts (dist/)
        run: cd fe && npm run build

      # 2.2 Khởi tạo Docker Buildx & Docker Compose Validate
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.yml config

      # 2.3 Đăng nhập Docker Hub (Dùng Secret đã cấu hình trên GitHub)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2.4 Build & Push Docker Image cho Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-backend:${{ github.sha }}

      # 2.5 Build & Push Docker Image cho Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          file: ./fe/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-frontend:${{ github.sha }}

  # ==========================================
  # GIAI ĐOẠN 3: CONTINUOUS DEPLOYMENT (CD)
  # (TỰ ĐỘNG SSH VÀO VPS ĐỂ KÉO IMAGE MỚI VÀ KHỞI CHẠY)
  # ==========================================
  deploy-to-server:
    name: 🌐 Deploy to VPS Server
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.1 Thiết lập kết nối SSH và chạy lệnh cập nhật trên VPS
      - name: Executing remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment on VPS..."
            cd ~/expense-app

            # Đăng nhập Docker Hub trên VPS nếu cần
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Kéo (Pull) các Image bản mới nhất vừa được build
            docker compose -f docker-compose.prod.yml pull

            # Khởi động lại containers với image mới
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Dọn dẹp các images cũ không còn sử dụng để tiết kiệm dung lượng ổ cứng VPS
            docker image prune -f

            echo "✅ Deployment completed successfully for lnpapp.id.vn!"
