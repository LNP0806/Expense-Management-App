services:
  # Cơ sở dữ liệu nội bộ
  db:
    image: postgres:16-alpine
    container_name: project-db
    restart: always
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lưu ý: Không mở ports ra ngoài host ở Production để bảo mật tối đa

  # Ứng dụng Backend
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      target: prod
    container_name: project-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-devops_user}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
      DB_NAME: ${DB_NAME:-app_db}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      JWT_SECRET: ${JWT_SECRET:-this_is_super_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-this_is_very_super_secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_AI_MODEL: ${GEMINI_AI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      - db
    command: >
      sh -c "npm run migrate && node src/server.js"

  # Ứng dụng Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: prod
    container_name: project-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
