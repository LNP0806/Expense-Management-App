name: Continuous Integration (CI)

# Kích hoạt pipeline khi có commit push vào main hoặc khi mở Pull Request vào main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM TRA CHẤT LƯỢNG MÃ NGUỒN (TESTING & LINTING)
  # ==========================================

  # 1.1 Kiểm tra Frontend (Linting)
  test-frontend:
    name: 🧪 Test & Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 1.2 Kiểm tra Backend (Unit & Integration Tests)
  test-backend:
    name: 🧪 Test Backend APIs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: be/package-lock.json

      - name: Install Backend dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret

  # ==========================================
  # GIAI ĐOẠN 2: BUILD & XÁC THỰC ARTIFACTS
  # (CHỈ CHẠY KHI TOÀN BỘ TEST PHÍA TRÊN ĐÃ PASS)
  # ==========================================
  build-and-verify:
    name: 🚀 Build Frontend & Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend] # <-- Ràng buộc: Tất cả test phải Pass 100% trước

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2.1 Build thử Frontend (React/Vite)
      - name: Setup Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Frontend dependencies
        run: cd fe && npm ci

      - name: Build Frontend Artifacts (dist/)
        run: cd fe && npm run build

      # 2.2 Khởi tạo Docker Buildx & Build kiểm tra Docker Images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.yml config

      - name: Build Docker Images (Backend & Frontend Production)
        run: docker compose -f docker-compose.yml build
